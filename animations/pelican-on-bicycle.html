<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕踏风 · Pelican on a Bicycle</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 26px;
    background:
      radial-gradient(120% 130% at 50% -10%, #f7fbff 0%, #e2edfa 42%, #c6d7ee 100%);
    font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  .stage {
    width: min(980px, 100%);
    border-radius: 30px;
    overflow: hidden;
    background: #ffffff;
    box-shadow:
      0 34px 70px -34px rgba(21, 48, 88, .58),
      0 1px 0 rgba(255, 255, 255, .9) inset;
  }
  .stage svg { display: block; width: 100%; height: auto; }
  .caption {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    padding: 14px 26px 18px;
    font-size: 13px;
    letter-spacing: .06em;
    color: #6b7d95;
    border-top: 1px solid #eef2f8;
  }
  .caption strong { color: #2d3d55; font-weight: 600; letter-spacing: .02em; }
  .caption span { font-variant-numeric: tabular-nums; opacity: .8; }
</style>
</head>
<body>
<main class="stage">
  <svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
    <title id="ttl">鹈鹕骑单车</title>
    <desc id="dsc">一只系着红围巾的鹈鹕踩着自行车沿乡间小路前行：车轮与曲柄在转，双腿跟着蹬踏，围巾在风里摆动，云朵缓缓漂移。</desc>

    <defs>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c7e5ff"/>
        <stop offset="55%" stop-color="#e8f5ff"/>
        <stop offset="100%" stop-color="#fbfeff"/>
      </linearGradient>
      <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#bcc7d6"/>
        <stop offset="100%" stop-color="#9fadc0"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffeaa6" stop-opacity=".95"/>
        <stop offset="58%" stop-color="#ffeaa6" stop-opacity=".32"/>
        <stop offset="100%" stop-color="#ffeaa6" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="bodyG" x1="0.12" y1="0" x2="0.88" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="62%" stop-color="#faf6ec"/>
        <stop offset="100%" stop-color="#e5decc"/>
      </linearGradient>
      <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0.7">
        <stop offset="0%" stop-color="#ffd467"/>
        <stop offset="100%" stop-color="#f2a120"/>
      </linearGradient>
      <linearGradient id="pouchG" x1="0" y1="0" x2="0.2" y2="1">
        <stop offset="0%" stop-color="#ffdc8a"/>
        <stop offset="100%" stop-color="#eda434"/>
      </linearGradient>
      <filter id="blur6" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
    </defs>

    <!-- ================= 天空 / 云 / 太阳 ================= -->
    <rect width="800" height="520" fill="url(#skyG)"/>

    <circle cx="672" cy="98" r="126" fill="url(#sunGlow)"/>
    <g>
      <circle cx="672" cy="98" r="40" fill="#ffd76b"/>
      <circle cx="672" cy="98" r="40" fill="none" stroke="#ffc63f" stroke-width="3" opacity=".55"/>
    </g>

    <g fill="#ffffff" opacity=".95">
      <animateTransform attributeName="transform" type="translate" values="0 0; 26 0; 0 0" dur="11s" repeatCount="indefinite"/>
      <ellipse cx="152" cy="106" rx="54" ry="26"/>
      <ellipse cx="198" cy="120" rx="40" ry="19"/>
      <ellipse cx="110" cy="120" rx="36" ry="17"/>
    </g>
    <g fill="#ffffff" opacity=".78">
      <animateTransform attributeName="transform" type="translate" values="0 0; -32 0; 0 0" dur="15s" repeatCount="indefinite"/>
      <ellipse cx="470" cy="76" rx="44" ry="21"/>
      <ellipse cx="512" cy="88" rx="32" ry="15"/>
      <ellipse cx="436" cy="88" rx="28" ry="13"/>
    </g>
    <g fill="#ffffff" opacity=".66">
      <animateTransform attributeName="transform" type="translate" values="0 0; 18 0; 0 0" dur="8s" repeatCount="indefinite"/>
      <ellipse cx="300" cy="152" rx="34" ry="15"/>
      <ellipse cx="332" cy="160" rx="24" ry="11"/>
    </g>

    <!-- ================= 远山 / 草地 / 路面 ================= -->
    <path d="M0,430 C90,352 190,350 272,404 C332,442 402,438 470,404 C560,360 662,362 800,428 L800,438 L0,438 Z"
          fill="#b9e5cb"/>
    <path d="M0,430 C120,392 226,398 300,420 C380,444 470,438 560,414 C650,390 740,404 800,428 L800,438 L0,438 Z"
          fill="#a3dab9"/>
    <rect x="0" y="424" width="800" height="8" fill="#8ccfa8"/>

    <rect x="0" y="430" width="800" height="90" fill="url(#roadG)"/>
    <rect x="0" y="430" width="800" height="3" fill="#8fa0b5" opacity=".9"/>

    <ellipse cx="386" cy="436" rx="178" ry="9" fill="#4b5f79" opacity=".2" filter="url(#blur6)"/>

    <line x1="-40" y1="472" x2="840" y2="472" stroke="#ffffff" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="30 26" opacity=".85">
      <animate attributeName="stroke-dashoffset" values="56;0" dur="0.72s" repeatCount="indefinite"/>
    </line>

    <!-- ================= 速度线 ================= -->
    <g stroke="#8fa8c4" stroke-width="4" stroke-linecap="round" fill="none">
      <g opacity=".8">
        <animateTransform attributeName="transform" type="translate" values="40 0; -90 0" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.85;0" dur="0.9s" repeatCount="indefinite"/>
        <line x1="170" y1="286" x2="216" y2="286"/>
        <line x1="150" y1="316" x2="204" y2="316"/>
        <line x1="176" y1="346" x2="214" y2="346"/>
      </g>
    </g>

    <!-- ================= 整车 + 鹈鹕（整体轻微颠簸） ================= -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -2.5; 0 0; 0 -1.5; 0 0" dur="1.2s" repeatCount="indefinite"/>

      <!-- ---------- 远侧腿 ---------- -->
      <path d="M328,258 Q330,312 353,388" fill="none" stroke="#d97e37" stroke-width="13" stroke-linecap="round">
        <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
          keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
          values="M328,258 Q330,312 353,388;
                  M328,258 Q334,302 362,365;
                  M328,258 Q354,298 385,356;
                  M328,258 Q370,302 408,365;
                  M328,258 Q376,312 417,388;
                  M328,258 Q370,322 408,411;
                  M328,258 Q356,330 385,420;
                  M328,258 Q334,326 362,411;
                  M328,258 Q330,312 353,388"/>
      </path>

      <!-- ---------- 后轮 ---------- -->
      <g transform="translate(250,360)">
        <circle r="66" fill="none" stroke="#33383f" stroke-width="11"/>
        <circle r="57" fill="none" stroke="#cdd5e0" stroke-width="5"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.85s" repeatCount="indefinite"/>
          <g stroke="#b3bdcb" stroke-width="2.5" stroke-linecap="round">
            <line x1="-53" y1="0" x2="53" y2="0"/>
            <line x1="-53" y1="0" x2="53" y2="0" transform="rotate(30)"/>
            <line x1="-53" y1="0" x2="53" y2="0" transform="rotate(60)"/>
            <line x1="-53" y1="0" x2="53" y2="0" transform="rotate(90)"/>
            <line x1="-53" y1="0" x2="53" y2="0" transform="rotate(120)"/>
            <line x1="-53" y1="0" x2="53" y2="0" transform="rotate(150)"/>
          </g>
          <circle r="7" fill="#8b93a1"/>
          <circle r="3" fill="#5c6570"/>
        </g>
      </g>

      <!-- ---------- 前轮 ---------- -->
      <g transform="translate(520,360)">
        <circle r="66" fill="none" stroke="#33383f" stroke-width="11"/>
        <circle r="57" fill="none" stroke="#cdd5e0" stroke-width="5"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.85s" repeatCount="indefinite"/>
          <g stroke="#b3bdcb" stroke-width="2.5" stroke-linecap="round">
            <line x1="-53" y1="0" x2="53" y2="0"/>
            <line x1="-53" y1="0" x2="53" y2="0" transform="rotate(30)"/>
            <line x1="-53" y1="0" x2="53" y2="0" transform="rotate(60)"/>
            <line x1="-53" y1="0" x2="53" y2="0" transform="rotate(90)"/>
            <line x1="-53" y1="0" x2="53" y2="0" transform="rotate(120)"/>
            <line x1="-53" y1="0" x2="53" y2="0" transform="rotate(150)"/>
          </g>
          <circle r="7" fill="#8b93a1"/>
          <circle r="3" fill="#5c6570"/>
        </g>
      </g>

      <!-- ---------- 链条 ---------- -->
      <g stroke="#7d8794" stroke-width="4" stroke-dasharray="5 4" fill="none">
        <line x1="250" y1="350" x2="385" y2="367">
          <animate attributeName="stroke-dashoffset" values="0;-18" dur="0.45s" repeatCount="indefinite"/>
        </line>
        <line x1="250" y1="370" x2="385" y2="409">
          <animate attributeName="stroke-dashoffset" values="0;18" dur="0.45s" repeatCount="indefinite"/>
        </line>
      </g>

      <!-- ---------- 车架（描边层 + 主色层） ---------- -->
      <g fill="none" stroke="#a83f37" stroke-width="15" stroke-linecap="round">
        <path d="M385,388 L330,288"/>
        <path d="M330,288 L498,276"/>
        <path d="M385,388 L508,330"/>
        <path d="M250,360 L385,388"/>
        <path d="M250,360 L330,288"/>
        <path d="M498,276 L511,330"/>
        <path d="M511,330 L520,360"/>
      </g>
      <g fill="none" stroke="#e4574b" stroke-width="9" stroke-linecap="round">
        <path d="M385,388 L330,288"/>
        <path d="M330,288 L498,276"/>
        <path d="M385,388 L508,330"/>
        <path d="M250,360 L385,388"/>
        <path d="M250,360 L330,288"/>
        <path d="M498,276 L511,330"/>
        <path d="M511,330 L520,360"/>
        <path d="M330,296 L326,280"/>
      </g>

      <!-- ---------- 车把 ---------- -->
      <path d="M498,276 L500,262 C504,250 516,248 528,256" fill="none"
            stroke="#39414d" stroke-width="9" stroke-linecap="round"/>
      <circle cx="528" cy="256" r="7" fill="#262d37"/>

      <!-- ---------- 车座 ---------- -->
      <g transform="rotate(-3 328 277)">
        <rect x="297" y="270" width="62" height="15" rx="7.5" fill="#39414d"/>
      </g>

      <!-- ---------- 牙盘 / 脚踏 ---------- -->
      <g transform="translate(385,388)">
        <circle r="21" fill="none" stroke="#9aa4b4" stroke-width="5"/>
        <circle r="15" fill="#c8d0dc"/>
        <circle r="5" fill="#7f8896"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="32" y2="0" stroke="#39414d" stroke-width="7" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="-32" y2="0" stroke="#39414d" stroke-width="7" stroke-linecap="round"/>
          <g transform="translate(32,0)">
            <g>
              <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.2s" repeatCount="indefinite"/>
              <rect x="-11" y="-4" width="22" height="8" rx="3" fill="#2f3742"/>
              <ellipse cx="-1" cy="-7" rx="12" ry="7.5" fill="#f2924a"/>
              <path d="M-9,-12 q6,-3 12,-1" fill="none" stroke="#cd7029" stroke-width="2" stroke-linecap="round"/>
            </g>
          </g>
          <g transform="translate(-32,0)">
            <g>
              <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.2s" repeatCount="indefinite"/>
              <rect x="-11" y="-4" width="22" height="8" rx="3" fill="#2f3742"/>
              <ellipse cx="-1" cy="-7" rx="12" ry="7.5" fill="#d97e37"/>
            </g>
          </g>
        </g>
      </g>

      <!-- ---------- 鹈鹕：远侧翅膀 ---------- -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0 262 202; -15 262 202; 0 262 202" dur="1.05s" repeatCount="indefinite"/>
        <path d="M268,196 C238,182 213,186 192,173 C196,197 223,213 257,217 Z" fill="#e6dfcd"/>
      </g>

      <!-- ---------- 鹈鹕：尾羽 ---------- -->
      <g fill="#efe8d6" stroke="#dbd2ba" stroke-width="2" stroke-linejoin="round">
        <path d="M240,180 C216,168 200,170 183,159 C190,181 208,196 235,204 Z"/>
        <path d="M234,204 C214,200 198,204 184,198 C192,214 210,222 232,220 Z"/>
      </g>

      <!-- ---------- 鹈鹕：身体 ---------- -->
      <ellipse cx="298" cy="212" rx="74" ry="62" fill="url(#bodyG)" stroke="#ded5c0" stroke-width="2.5"/>
      <path d="M262,252 C286,266 326,266 350,250" fill="none" stroke="#e2dac6" stroke-width="3" stroke-linecap="round" opacity=".9"/>

      <!-- ---------- 鹈鹕：红围巾（飘在背后） ---------- -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="-7 356 180; 6 356 180; -7 356 180" dur="0.95s" repeatCount="indefinite"/>
        <path d="M354,172 C320,154 288,162 256,144 L262,164 C296,183 326,193 352,192 Z" fill="#e8465f"/>
        <path d="M330,158 C310,150 292,152 276,146" fill="none" stroke="#c13450" stroke-width="3" stroke-linecap="round" opacity=".7"/>
      </g>

      <!-- ---------- 鹈鹕：脖子 + 头 ---------- -->
      <path d="M342,178 C352,144 366,128 384,120" fill="none" stroke="#faf6ec" stroke-width="30" stroke-linecap="round"/>
      <path d="M342,178 C352,144 366,128 384,120" fill="none" stroke="#ded5c0" stroke-width="30" stroke-linecap="round" opacity=".18"/>
      <circle cx="398" cy="118" r="31" fill="url(#bodyG)" stroke="#ded5c0" stroke-width="2.5"/>
      <path d="M384,92 q6,-13 16,-15 M394,90 q7,-10 16,-10" fill="none" stroke="#d8cfba" stroke-width="3" stroke-linecap="round"/>
      <circle cx="404" cy="109" r="5.6" fill="#23262b"/>
      <circle cx="406" cy="106.5" r="1.9" fill="#ffffff"/>

      <!-- ---------- 鹈鹕：围巾领口 ---------- -->
      <path d="M336,186 C348,198 366,198 378,186" fill="none" stroke="#e8465f" stroke-width="13" stroke-linecap="round"/>
      <path d="M336,186 C348,198 366,198 378,186" fill="none" stroke="#c13450" stroke-width="13" stroke-linecap="round" opacity=".28"/>

      <!-- ---------- 鹈鹕：喙 + 喉囊 ---------- -->
      <path d="M419,128 L549,156 C512,207 440,198 419,128 Z" fill="url(#pouchG)" stroke="#d99a24" stroke-width="3" stroke-linejoin="round"/>
      <path d="M419,128 L549,156 C512,207 440,198 419,128 Z" fill="#ffffff" opacity=".12"/>
      <path d="M420,104 C468,110 520,128 556,148 C561,152 557,159 549,156 C512,146 462,130 418,128 Z"
            fill="url(#beakG)" stroke="#d99a24" stroke-width="3" stroke-linejoin="round"/>
      <path d="M430,113 C474,119 518,134 546,149" fill="none" stroke="#fff2c6" stroke-width="3" stroke-linecap="round" opacity=".75"/>
      <circle cx="447" cy="118" r="2.6" fill="#c9861a" opacity=".8"/>

      <!-- ---------- 鹈鹕：近侧翅膀（搭在车把上） ---------- -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0 350 200; -3 350 200; 0 350 200" dur="1.2s" repeatCount="indefinite"/>
        <path d="M342,176 C396,178 458,204 512,242 C523,250 518,266 505,259 C458,239 400,232 350,230 C336,218 334,188 342,176 Z"
              fill="url(#bodyG)" stroke="#ded5c0" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M372,199 C414,213 458,235 496,252" fill="none" stroke="#ddd4bf" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M366,213 C408,224 448,240 484,255" fill="none" stroke="#ddd4bf" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M356,196 C378,192 400,196 420,204" fill="none" stroke="#e5ddca" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M506,244 C516,248 519,255 512,259" fill="none" stroke="#d8cfba" stroke-width="2.4" stroke-linecap="round"/>
      </g>

      <!-- ---------- 近侧腿 ---------- -->
      <path d="M340,258 Q390,310 417,388" fill="none" stroke="#f2924a" stroke-width="13" stroke-linecap="round">
        <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
          keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
          values="M340,258 Q390,310 417,388;
                  M340,258 Q386,322 408,411;
                  M340,258 Q376,330 385,420;
                  M340,258 Q360,326 362,411;
                  M340,258 Q348,312 353,388;
                  M340,258 Q350,302 362,365;
                  M340,258 Q368,298 385,356;
                  M340,258 Q384,302 408,365;
                  M340,258 Q390,310 417,388"/>
      </path>
    </g>

    <!-- ================= 前景点缀 ================= -->
    <g opacity=".55" stroke="#6f9f86" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M92,430 q0,-12 5,-17 M102,430 q2,-9 8,-13 M84,430 q-3,-9 -9,-12"/>
      <path d="M706,430 q0,-12 5,-17 M716,430 q2,-9 8,-13 M698,430 q-3,-9 -9,-12"/>
    </g>
  </svg>

  <div class="caption">
    <strong>鹈鹕踏风 · Pelican on a Bicycle</strong>
    <span>SVG + SMIL · 无水印 · 单文件</span>
  </div>
</main>
</body>
</html>
