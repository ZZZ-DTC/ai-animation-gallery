<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e6f3ee">
  <title>骑向晚霞的狐狸</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #e6f3ee; }
    svg { display: block; width: 100%; height: 100%; }
    #tail { transform-origin: 511px 325px; animation: tail-swish 1.4s ease-in-out infinite alternate; }
    #scarf-end { transform-origin: 621px 274px; animation: scarf-flutter .75s ease-in-out infinite alternate; }
    #fox-upper { animation: rider-bob .56s ease-in-out infinite alternate; }
    #road-markings { animation: road-roll 1.05s linear infinite; }
    #cloud-one { animation: cloud-drift 13s ease-in-out infinite alternate; }
    #cloud-two { animation: cloud-drift 18s ease-in-out infinite alternate-reverse; }
    @keyframes tail-swish { from { transform: rotate(-5deg); } to { transform: rotate(7deg); } }
    @keyframes scarf-flutter { from { transform: rotate(-7deg); } to { transform: rotate(9deg); } }
    @keyframes rider-bob { from { transform: translateY(0); } to { transform: translateY(3px); } }
    @keyframes road-roll { to { transform: translateX(-180px); } }
    @keyframes cloud-drift { from { transform: translateX(-14px); } to { transform: translateX(18px); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>

    <path d="M-1000 600Q-584 496-269 558T338 543Q578 478 808 549T1380 527Q1792 480 2200 574V1100H-1000Z" fill="#5e9b83"/>

    <g fill="#327b67" opacity=".85">

        <circle cx="0" cy="-85" r="5" fill="#f8c779" stroke="none"/>

    <g fill="none" stroke="#2c6763" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">

    <g id="crank" stroke="#263f40" stroke-linecap="round">
      <path d="M590 513h31 M590 513h-31" stroke-width="8"/>
      <path d="M609 513h25 M547 513h25" stroke-width="9"/>
    </g>
    <path id="near-leg" d="M571 350L659 428 621 513" fill="none" stroke="#df7844" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="near-shoe" fill="#293f3f"><ellipse rx="23" ry="11"/></g>

    <path d="M633 288q36 7 59 36l49 29" fill="none" stroke="#bd613d" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M647 285q30 10 51 36l47 28" fill="none" stroke="#e9874d" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M738 352q13 12 29 1" fill="none" stroke="#b95c3b" stroke-width="17" stroke-linecap="round"/>
    <path d="M762 351h21" fill="none" stroke="#263f40" stroke-width="7" stroke-linecap="round"/>

  <script>
    const scene = document.getElementById('scene');
    const sun = document.getElementById('sun');
    const sunHalo = document.getElementById('sun-halo');
    const rearSpokes = document.getElementById('rear-spokes');
    const frontSpokes = document.getElementById('front-spokes');
    const crank = document.getElementById('crank');
    const nearLeg = document.getElementById('near-leg');
    const farLeg = document.getElementById('far-leg');
    const nearShoe = document.getElementById('near-shoe');
    const farShoe = document.getElementById('far-shoe');

    function fitScene() {
      const ratio = window.innerWidth / window.innerHeight;
      const width = ratio < 1.2 ? 700 : Math.max(920, 700 * ratio);
      const height = width / ratio;
      scene.setAttribute('viewBox', `${600 - width / 2} ${350 - height / 2} ${width} ${height}`);
      const compact = ratio < 1.2;
      sun.setAttribute('cx', compact ? 807 : 1030);
      sun.setAttribute('cy', compact ? -116 : 139);
      sunHalo.setAttribute('cx', compact ? 807 : 1030);
      sunHalo.setAttribute('cy', compact ? -116 : 139);
    }

    function moveLeg(path, shoe, hipX, hipY, footX, footY) {
      const dx = footX - hipX;
      const dy = footY - hipY;
      const distance = Math.hypot(dx, dy);
      const upper = 117;
      const lower = 112;
      const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
      const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
      const kneeX = hipX + along * dx / distance + bend * dy / distance;
      const kneeY = hipY + along * dy / distance - bend * dx / distance;
      path.setAttribute('d', `M${hipX} ${hipY}L${kneeX} ${kneeY} ${footX} ${footY}`);
      shoe.setAttribute('transform', `translate(${footX} ${footY})`);
    }

    function draw(elapsed) {
      const wheelAngle = elapsed * .34;
      const pedalAngle = elapsed * .4;
      const radians = pedalAngle * Math.PI / 180;
      const footX = 590 + 31 * Math.cos(radians);
      const footY = 513 + 31 * Math.sin(radians);
      rearSpokes.setAttribute('transform', `rotate(${wheelAngle})`);
      frontSpokes.setAttribute('transform', `rotate(${wheelAngle})`);
      crank.setAttribute('transform', `rotate(${pedalAngle} 590 513)`);
      moveLeg(nearLeg, nearShoe, 571, 350, footX, footY);
      moveLeg(farLeg, farShoe, 548, 348, 1180 - footX, 1026 - footY);
    }

    fitScene();
    window.addEventListener('resize', fitScene);
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (reducedMotion.matches) {
      draw(0);
    } else {
      let start;
      function animate(now) {
        if (start === undefined) start = now;
        draw(now - start);
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
