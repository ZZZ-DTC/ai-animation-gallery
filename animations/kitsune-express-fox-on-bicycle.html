<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🦊 Kitsune Express · 骑单车的狐狸 (Animated SVG)</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:28px;
    background:#06060b;
    background-image:radial-gradient(circle at 50% -10%, #1d1533 0%, #0b0813 45%, #050509 100%);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage{width:min(1120px,100%);margin:0}
  svg{
    display:block;width:100%;height:auto;border-radius:26px;
    background:#120a1e;
    box-shadow:0 44px 100px -34px #000, 0 0 0 1px #ffffff12, 0 0 90px -30px #ff8a3d55;
  }
  figcaption{
    margin-top:16px;text-align:center;color:#8b86a9;
    font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;
  }
  figcaption b{color:#ffb37a;font-weight:600;letter-spacing:.1em}

  /* ── 背景滚动 ────────────────────────────── */
  .cloud{animation:drift 46s linear infinite}
  .cloud.p2{animation-duration:68s;animation-delay:-22s}
  .cloud.p3{animation-duration:88s;animation-delay:-51s}
  .cloud.p4{animation-duration:120s;animation-delay:-8s;opacity:.42}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-1180px)}}

  .dashes{animation:roll .55s linear infinite}
  @keyframes roll{from{transform:translateX(0)}to{transform:translateX(-120px)}}

  /* ── 速度线与尘土 ────────────────────────── */
  .streak{animation:streak 1.15s linear infinite;opacity:0}
  @keyframes streak{
    0%  {transform:translateX(70px); opacity:0}
    12% {opacity:.8}
    100%{transform:translateX(-300px);opacity:0}
  }
  .dust{transform-box:fill-box;transform-origin:center;animation:puff 1.1s ease-out infinite;opacity:0}
  @keyframes puff{
    0%  {transform:translate(0,0) scale(.3);opacity:.5}
    70% {opacity:.22}
    100%{transform:translate(-96px,-30px) scale(1.7);opacity:0}
  }

  /* ── 天空 ────────────────────────────────── */
  .star{animation:twinkle 3.2s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.95}}
  .glow{transform-box:fill-box;transform-origin:center;animation:pulse 6.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}

  @media (prefers-reduced-motion: reduce){
    .cloud,.dashes,.streak,.dust,.star,.glow{animation:none}
  }
</style>
</head>
<body>

<figure class="stage">
<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">一只狐狸骑着自行车穿过黄昏公路</title>
  <desc id="svgDesc">SVG 场景动画：车轮与曲柄匀速旋转，狐狸双腿按真实踏板轨迹屈伸踩踏，
    尾巴与围巾随风摆动，云层、路面虚线、尘土与速度线共同表现前进。</desc>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#171034"/>
      <stop offset="34%"  stop-color="#4a1f6b"/>
      <stop offset="58%"  stop-color="#a4377a"/>
      <stop offset="76%"  stop-color="#e8624d"/>
      <stop offset="89%"  stop-color="#ffa85c"/>
      <stop offset="100%" stop-color="#ffd79b"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff6cd" stop-opacity=".95"/>
      <stop offset="38%"  stop-color="#ffca6b" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunBody" cx="42%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#fff9dd"/>
      <stop offset="60%"  stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#ffb057"/>
    </radialGradient>

    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#332b4a"/>
      <stop offset="22%"  stop-color="#241d34"/>
      <stop offset="100%" stop-color="#100b1a"/>
    </linearGradient>

    <linearGradient id="furGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffb066"/>
      <stop offset="55%"  stop-color="#fb8434"/>
      <stop offset="100%" stop-color="#ef6a1f"/>
    </linearGradient>
    <linearGradient id="furLegGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f2812f"/>
      <stop offset="100%" stop-color="#d95a15"/>
    </linearGradient>

    <linearGradient id="hilFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4188" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#5b2f68" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="hilMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3d2154"/>
      <stop offset="100%" stop-color="#231231"/>
    </linearGradient>

    <!-- 车架管材（一次定义，两次描边：暗底 + 亮色） -->
    <g id="frameTubes" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M320,350 L455,372"/>                     <!-- 后下叉 -->
      <path d="M320,350 L398,252"/>                     <!-- 后上叉 -->
      <path d="M455,372 L398,252"/>                     <!-- 立管 -->
      <path d="M455,372 L585,288"/>                     <!-- 下管 -->
      <path d="M398,252 L575,242"/>                     <!-- 上管 -->
      <path d="M575,242 L585,288"/>                     <!-- 头管 -->
      <path d="M585,288 Q597,320 600,350"/>             <!-- 前叉 -->
    </g>
  </defs>

  <!-- ══════════════ 天空 ══════════════ -->
  <rect x="0" y="0" width="900" height="436" fill="url(#skyGrad)"/>

  <g fill="#ffffff">
    <circle class="star" cx="96"  cy="52"  r="1.7" style="animation-delay:-.4s"/>
    <circle class="star" cx="188" cy="104" r="1.3" style="animation-delay:-1.7s"/>
    <circle class="star" cx="286" cy="44"  r="1.9" style="animation-delay:-2.4s"/>
    <circle class="star" cx="392" cy="88"  r="1.2" style="animation-delay:-.9s"/>
    <circle class="star" cx="470" cy="38"  r="1.6" style="animation-delay:-2.9s"/>
    <circle class="star" cx="560" cy="76"  r="1.2" style="animation-delay:-1.2s"/>
    <circle class="star" cx="660" cy="40"  r="1.5" style="animation-delay:-2.1s"/>
    <circle class="star" cx="812" cy="92"  r="1.3" style="animation-delay:-.6s"/>
    <circle class="star" cx="120" cy="150" r="1.1" style="animation-delay:-3.1s"/>
    <circle class="star" cx="836" cy="160" r="1.1" style="animation-delay:-1.9s"/>
  </g>

  <!-- 落日 -->
  <circle class="glow" cx="742" cy="266" r="132" fill="url(#sunGlow)"/>
  <circle cx="742" cy="266" r="52" fill="url(#sunBody)"/>
  <circle cx="742" cy="266" r="52" fill="none" stroke="#fff2c8" stroke-width="1.4" opacity=".5"/>

  <!-- 云 -->
  <g transform="translate(742,104)">
    <g class="cloud" fill="#ffd9c0" opacity=".55">
      <circle cx="0" cy="0" r="22"/><circle cx="28" cy="7" r="16"/>

    </g>
  </g>
  <g transform="translate(360,150)">

  </g>
  <g transform="translate(880,196)">

      <circle cx="0" cy="0" r="14"/><circle cx="18" cy="5" r="10"/>
      <circle cx="-17" cy="5" r="9"/><rect x="-28" y="3" width="56" height="10" rx="5"/>
    </g>
  </g>
  <g transform="translate(560,66)">
    <g class="cloud p4" fill="#ffe4d2" opacity=".28">
      <circle cx="0" cy="0" r="13"/><circle cx="16" cy="4" r="9"/>
      <circle cx="-15" cy="4" r="8"/><rect x="-24" y="2" width="48" height="9" rx="4.5"/>
    </g>
  </g>

  <!-- ══════════════ 远山 / 近坡 ══════════════ -->
  <path fill="url(#hilFar)" opacity=".8" d="
    M-20,398 C 70,346 152,332 232,354 C 300,373 344,338 424,332
    C 504,326 546,358 626,354 C 704,350 764,322 862,338
    C 890,343 912,352 920,358 L920,442 L-20,442 Z"/>

  <path fill="url(#hilMid)" d="
    M-20,410 C 74,374 162,376 252,394 C 342,412 402,378 492,382
    C 572,386 622,406 702,400 C 782,394 852,406 920,398
    L920,442 L-20,442 Z"/>

  <!-- 远处小树剪影 -->
  <g fill="#1a0e26" opacity=".9">
    <path d="M118,404 l9,-26 l9,26 z"/><rect x="125.5" y="402" width="3" height="8"/>
    <path d="M148,408 l7,-20 l7,20 z"/><rect x="153.5" y="406" width="3" height="7"/>
    <path d="M770,400 l10,-30 l10,30 z"/><rect x="778" y="398" width="4" height="9"/>
    <path d="M802,406 l7,-21 l7,21 z"/><rect x="807.5" y="404" width="3" height="7"/>
  </g>

  <!-- ══════════════ 公路 ══════════════ -->
  <rect x="0" y="432" width="900" height="88" fill="url(#roadGrad)"/>
  <rect x="0" y="432" width="900" height="2.5" fill="#ffb27a" opacity=".35"/>

  <g class="dashes" fill="#ffd9a8" opacity=".5">
    <rect x="-120" y="474" width="62" height="6" rx="3"/>
    <rect x="0"    y="474" width="62" height="6" rx="3"/>
    <rect x="120"  y="474" width="62" height="6" rx="3"/>
    <rect x="240"  y="474" width="62" height="6" rx="3"/>
    <rect x="360"  y="474" width="62" height="6" rx="3"/>
    <rect x="480"  y="474" width="62" height="6" rx="3"/>
    <rect x="600"  y="474" width="62" height="6" rx="3"/>
    <rect x="720"  y="474" width="62" height="6" rx="3"/>
    <rect x="840"  y="474" width="62" height="6" rx="3"/>
    <rect x="960"  y="474" width="62" height="6" rx="3"/>
  </g>

  <!-- 路面细碎反光 -->
  <g fill="#7d6fa8" opacity=".22">
    <circle cx="180" cy="458" r="2"/><circle cx="342" cy="466" r="1.6"/>
    <circle cx="520" cy="452" r="2.2"/><circle cx="688" cy="462" r="1.4"/>
    <circle cx="806" cy="450" r="1.8"/><circle cx="66"  cy="470" r="1.5"/>
  </g>

  <!-- ══════════════ 速度线 ══════════════ -->
  <g stroke="#ffe0bd" stroke-linecap="round" fill="none">
    <line class="streak" x1="300" y1="196" x2="370" y2="196" stroke-width="3"   style="animation-delay:-.05s"/>
    <line class="streak" x1="240" y1="252" x2="330" y2="252" stroke-width="2.4" style="animation-delay:-.42s"/>
    <line class="streak" x1="330" y1="308" x2="392" y2="308" stroke-width="2"   style="animation-delay:-.78s"/>
    <line class="streak" x1="200" y1="344" x2="286" y2="344" stroke-width="2.6" style="animation-delay:-.22s"/>
    <line class="streak" x1="380" y1="404" x2="440" y2="404" stroke-width="2.2" style="animation-delay:-.62s"/>
  </g>

  <!-- ══════════════ 后轮扬尘 ══════════════ -->
  <g fill="#c9b3d8">
    <circle class="dust" cx="284" cy="418" r="11"  style="animation-delay:-.05s"/>
    <circle class="dust" cx="266" cy="424" r="8"   style="animation-delay:-.42s"/>
    <circle class="dust" cx="252" cy="414" r="13"  style="animation-delay:-.78s"/>
  </g>

  <!-- 地面投影 -->
  <ellipse cx="320" cy="434" rx="94" ry="8" fill="#000" opacity=".35"/>
  <ellipse cx="600" cy="434" rx="94" ry="8" fill="#000" opacity=".35"/>

  <!-- ══════════════ 自行车 ══════════════ -->
  <g id="bicycle">

    <!-- 后轮 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 320 350" to="360 320 350" dur="1.4s" repeatCount="indefinite"/>
      <circle cx="320" cy="350" r="82" fill="none" stroke="#14141e" stroke-width="14"/>
      <circle cx="320" cy="350" r="82" fill="none" stroke="#5a5f7d" stroke-width="4"
              stroke-dasharray="9 13" opacity=".85"/>
      <circle cx="320" cy="350" r="70" fill="none" stroke="#cfd7e8" stroke-width="3.5"/>
      <circle cx="320" cy="350" r="63" fill="none" stroke="#8b93ab" stroke-width="1.6" opacity=".6"/>
      <g stroke="#dfe6f5" stroke-width="2.2" opacity=".9">
        <line x1="250" y1="350" x2="390" y2="350"/>
        <line x1="259.4" y1="315" x2="380.6" y2="385"/>
        <line x1="285" y1="289.4" x2="355" y2="410.6"/>
        <line x1="320" y1="280" x2="320" y2="420"/>
        <line x1="355" y1="289.4" x2="285" y2="410.6"/>
        <line x1="380.6" y1="315" x2="259.4" y2="385"/>
      </g>
      <circle cx="320" cy="350" r="8" fill="#dfe6f5"/>
      <circle cx="320" cy="350" r="3.2" fill="#2b3247"/>
    </g>

    <!-- 前轮 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 600 350" to="360 600 350" dur="1.4s" repeatCount="indefinite"/>
      <circle cx="600" cy="350" r="82" fill="none" stroke="#14141e" stroke-width="14"/>
      <circle cx="600" cy="350" r="82" fill="none" stroke="#5a5f7d" stroke-width="4"
              stroke-dasharray="9 13" opacity=".85"/>
      <circle cx="600" cy="350" r="70" fill="none" stroke="#cfd7e8" stroke-width="3.5"/>
      <circle cx="600" cy="350" r="63" fill="none" stroke="#8b93ab" stroke-width="1.6" opacity=".6"/>
      <g stroke="#dfe6f5" stroke-width="2.2" opacity=".9">
        <line x1="530" y1="350" x2="670" y2="350"/>
        <line x1="539.4" y1="315" x2="660.6" y2="385"/>
        <line x1="565" y1="289.4" x2="635" y2="410.6"/>
        <line x1="600" y1="280" x2="600" y2="420"/>
        <line x1="635" y1="289.4" x2="565" y2="410.6"/>
        <line x1="660.6" y1="315" x2="539.4" y2="385"/>
      </g>
      <circle cx="600" cy="350" r="8" fill="#dfe6f5"/>
      <circle cx="600" cy="350" r="3.2" fill="#2b3247"/>
    </g>

    <!-- 远侧小腿（在车架之后） -->
    <g id="legFar">
      <g>
        <animateTransform attributeName="transform" type="rotate" dur="2.2s" repeatCount="indefinite"
          values="-34.61 398 244;-32.6 398 244;-20.71 398 244;-7.57 398 244;0 398 244;-0.6 398 244;-8.96 398 244;-23.27 398 244;-34.61 398 244"/>
        <path d="M398,244 L483.62,289.59" fill="none" stroke="#8a3407" stroke-width="27" stroke-linecap="round"/>
        <path d="M398,244 L483.62,289.59" fill="none" stroke="#c65b18" stroke-width="20" stroke-linecap="round"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2.2s" repeatCount="indefinite"
            values="40.16 483.62 289.59;27.49 483.62 289.59;10.98 483.62 289.59;-0.44 483.62 289.59;0 483.62 289.59;12.02 483.62 289.59;28.56 483.62 289.59;40.65 483.62 289.59;40.16 483.62 289.59"/>
          <path d="M483.62,289.59 L455,402" fill="none" stroke="#8a3407" stroke-width="19" stroke-linecap="round"/>
          <path d="M483.62,289.59 L455,402" fill="none" stroke="#b34c12" stroke-width="13" stroke-linecap="round"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" dur="2.2s" repeatCount="indefinite"
              values="5.55 455 402;-5.12 455 402;-9.73 455 402;-8.01 455 402;0 455 402;11.42 455 402;19.6 455 402;17.37 455 402;5.55 455 402"/>
            <ellipse cx="455" cy="402" rx="13" ry="7" fill="#3a1c07"/>
          </g>
        </g>
      </g>
    </g>

    <!-- 远侧曲柄 + 脚踏 -->
    <g opacity=".82">
      <animateTransform attributeName="transform" type="rotate" dur="2.2s" repeatCount="indefinite"
        values="90 455 372;450 455 372"/>
      <line x1="455" y1="372" x2="425" y2="372" stroke="#0b3b34" stroke-width="7" stroke-linecap="round"/>

          values="0 425 372;-360 425 372"/>
        <rect x="412" y="366" width="26" height="9" rx="4" fill="#6f7891"/>

    </g>

    <!-- 链条 -->
    <g stroke="#9aa3ba" stroke-width="3" stroke-dasharray="6 3" opacity=".9">
      <line x1="455" y1="350" x2="320" y2="340"/>
      <line x1="455" y1="394" x2="320" y2="360"/>
    </g>
    <circle cx="320" cy="350" r="10" fill="#8b93ab" stroke="#2b3247" stroke-width="2"/>

    <!-- 车架 -->

    <use href="#frameTubes" stroke="#2fe0c0" stroke-width="9"/>
    <use href="#frameTubes" stroke="#a7fff0" stroke-width="2.4" opacity=".55"
         transform="translate(-2,-2)"/>

    <!-- 座管 + 坐垫 -->

          fill="#20243a" stroke="#070a12" stroke-width="2.5"/>
    <path d="M370,250 C 382,244 404,244 416,250" fill="none" stroke="#4b5273" stroke-width="2"
          stroke-linecap="round"/>

    <!-- 前叉肩 + 把立 + 车把 -->
    <path d="M575,242 C 580,232 590,228 598,233" fill="none"
          stroke="#072b27" stroke-width="13" stroke-linecap="round"/>
    <path d="M575,242 C 580,232 590,228 598,233" fill="none"
          stroke="#2fe0c0" stroke-width="7" stroke-linecap="round"/>
    <circle cx="599" cy="234" r="7.5" fill="#252a3d" stroke="#072b27" stroke-width="2"/>

    <!-- 近侧曲柄 + 牙盘 + 脚踏 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="2.2s" repeatCount="indefinite"
        values="90 455 372;450 455 372"/>
      <line x1="455" y1="372" x2="485" y2="372" stroke="#0b3b34" stroke-width="8" stroke-linecap="round"/>
      <line x1="455" y1="372" x2="485" y2="372" stroke="#2fe0c0" stroke-width="4" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" dur="2.2s" repeatCount="indefinite"
          values="0 485 372;-360 485 372"/>
        <rect x="472" y="365" width="26" height="10" rx="4" fill="#dfe6f5" stroke="#2b3247" stroke-width="1.5"/>
      </g>
      <circle cx="455" cy="372" r="23" fill="#0e4a43" stroke="#072b27" stroke-width="2.5"/>
      <circle cx="455" cy="372" r="23" fill="none" stroke="#2fe0c0" stroke-width="3.5"
              stroke-dasharray="4 4"/>
      <circle cx="455" cy="372" r="7" fill="#2fe0c0"/>
    </g>
  </g>

  <!-- ══════════════ 狐狸 ══════════════ -->
  <g id="fox">

    <!-- 尾巴（在车身之后、身体之前） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="2.4s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1"
        keySplines=".42 0 .58 1;.42 0 .58 1"
        values="-5 396 236;6 396 236;-5 396 236"/>
      <path d="M396,236 C 356,258 312,250 294,222 C 280,200 296,176 316,184"
            fill="none" stroke="#a33c0a" stroke-width="43" stroke-linecap="round"/>
      <path d="M396,236 C 356,258 312,250 294,222 C 280,200 296,176 316,184"
            fill="none" stroke="url(#furGrad)" stroke-width="35" stroke-linecap="round"/>
      <path d="M300,216 C 289,200 296,183 312,186"
            fill="none" stroke="#fff2df" stroke-width="31" stroke-linecap="round"/>
    </g>

    <!-- 身体 -->
    <ellipse cx="452" cy="220" rx="74" ry="34" transform="rotate(-19 452 220)"
             fill="url(#furGrad)" stroke="#a33c0a" stroke-width="3"/>
    <ellipse cx="446" cy="233" rx="52" ry="17" transform="rotate(-16 446 233)"
             fill="#ffeedb" opacity=".9"/>
    <circle cx="508" cy="201" r="35" fill="url(#furGrad)" stroke="#a33c0a" stroke-width="3"/>

    <!-- 脖子 -->
    <path d="M496,200 L536,162" fill="none" stroke="#a33c0a" stroke-width="50" stroke-linecap="round"/>
    <path d="M496,200 L536,162" fill="none" stroke="url(#furGrad)" stroke-width="42" stroke-linecap="round"/>

    <!-- 耳朵 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="5.4s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.35;0.55;0.8;1"
        keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"
